name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    # The smoke test drives the real server, which shells out to PowerShell and CIM.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test
