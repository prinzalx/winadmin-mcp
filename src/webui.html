<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Windows Admin MCP</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #14161a;
    --panel: #1c1f25;
    --line: #2b3038;
    --fg: #e6e8eb;
    --muted: #98a1ad;
    --accent: #4da3ff;
    --green: #4ec970;
    --amber: #e0b341;
    --red: #e06c60;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.5 "Segoe UI", system-ui, sans-serif;
  }
  header {
    display: flex;
    align-items: baseline;
    gap: 12px;
    padding: 18px 24px;
    border-bottom: 1px solid var(--line);
  }
  header h1 { font-size: 17px; margin: 0; font-weight: 600; }
  header .meta { color: var(--muted); font-size: 12px; }
  main { display: grid; grid-template-columns: minmax(420px, 1.1fr) minmax(380px, 1fr); gap: 24px; padding: 24px; align-items: start; }
  @media (max-width: 980px) { main { grid-template-columns: 1fr; } }
  h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 0 0 10px; font-weight: 600; }
  section {
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 12px;
    margin-bottom: 22px;
    overflow: hidden;
    box-shadow: 0 1px 3px #0006;
  }
  /* The heading is a bar, so it stands out more than the section around it. */
  section > h2 {
    display: flex;
    align-items: center;
    margin: 0;
    padding: 11px 16px;
    font-size: 13px;
    font-weight: 700;
    letter-spacing: .07em;
    text-transform: uppercase;
    color: var(--fg);
    background: #262c36;
    border-bottom: 1px solid var(--line);
  }
  section > h2::before {
    content: "";
    display: inline-block;
    width: 4px;
    height: 13px;
    margin-right: 9px;
    vertical-align: -1px;
    border-radius: 2px;
    background: var(--accent);
  }
  section > .body { padding: 14px 16px 16px; }
  /* Master switches: one per group, one for everything. */
  .master {
    display: inline-flex;
    align-items: center;
    gap: 7px;
    font-size: 11px;
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
    color: var(--muted);
    cursor: pointer;
    user-select: none;
  }
  .master input { width: 15px; height: 15px; accent-color: var(--accent); cursor: pointer; }
  .h2-actions { margin-left: auto; display: inline-flex; gap: 14px; align-items: center; }
  /* Browser-style tabs: one per module, so a page never holds eighty tools. */
  .tabs { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 14px; border-bottom: 1px solid var(--line); }
  .tab {
    background: none; border: 1px solid transparent; border-bottom: 0; border-radius: 8px 8px 0 0;
    padding: 6px 11px 7px; font: inherit; font-size: 12px; color: var(--muted); cursor: pointer;
    display: inline-flex; align-items: center; gap: 7px;
  }
  .tab:hover { color: var(--fg); }
  .tab.active {
    color: var(--fg); background: #16181d; border-color: var(--line);
    box-shadow: inset 0 2px 0 var(--accent);
  }
  .tab .count { font-size: 10px; color: var(--muted); border: 1px solid var(--line); border-radius: 99px; padding: 0 5px; }
  .tab.active .count { color: var(--green); border-color: #2c4634; }
  .group { border-top: 1px solid var(--line); padding-top: 10px; margin-top: 12px; }
  .group:first-of-type { border-top: 0; padding-top: 0; margin-top: 0; }
  .group-name {
    display: grid;
    grid-template-columns: 1fr auto auto auto;
    gap: 12px;
    align-items: center;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: .07em;
    color: var(--fg);
    font-weight: 700;
    margin-bottom: 6px;
  }
  .group-name .master { justify-self: center; font-weight: 400; }
  .tool { display: grid; grid-template-columns: 1fr auto auto auto; gap: 12px; align-items: center; padding: 7px 0; }
  .tool .name { font-family: Consolas, monospace; font-size: 13px; }
  .tool .desc { color: var(--muted); font-size: 12px; }
  .tool-head { padding: 0 0 8px; }
  .tool-head .col {
    display: block;
    font-size: 11px;
    line-height: 1.25;
    text-transform: uppercase;
    letter-spacing: .05em;
    font-weight: 700;
    color: var(--fg);
    text-align: center;
  }
  .tool-head .col small {
    display: block;
    margin-top: 2px;
    font-size: 10px;
    font-weight: 400;
    letter-spacing: 0;
    text-transform: none;
    color: var(--muted);
  }
  /* The mini documentation shown when the pointer rests on a tool. */
  #docs-pop {
    position: fixed; z-index: 10; max-width: 460px; display: none;
    background: #101216; border: 1px solid var(--accent); border-radius: 10px;
    padding: 10px 12px; box-shadow: 0 6px 20px #000a; pointer-events: none;
  }
  #docs-pop b { display: block; font-family: Consolas, monospace; font-size: 12px; margin-bottom: 4px; }
  #docs-pop p { margin: 0; white-space: pre-line; font-size: 12px; color: var(--muted); line-height: 1.45; }
  .badge { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; padding: 1px 6px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }
  .badge.write { color: var(--amber); border-color: #4a3d1d; }
  .badge.off { color: var(--red); }
  input[type=checkbox] { width: 17px; height: 17px; accent-color: var(--accent); cursor: pointer; }
  input[type=checkbox]:disabled { opacity: .35; cursor: not-allowed; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  td, th { text-align: left; padding: 5px 8px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; }
  .kv { display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 10px; }
  .kv div { background: #16181d; border: 1px solid var(--line); border-radius: 8px; padding: 10px; }
  .kv span { display: block; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .06em; }
  .kv b { font-size: 16px; font-weight: 600; }
  .pending { border-left: 3px solid var(--amber); }
  .actions button { margin-right: 6px; }
  button {
    background: #262b33; color: var(--fg); border: 1px solid var(--line);
    border-radius: 6px; padding: 4px 10px; font: inherit; font-size: 12px; cursor: pointer;
  }
  button:hover { border-color: var(--accent); }
  button.danger:hover { border-color: var(--red); }
  .log td { font-family: Consolas, monospace; font-size: 11px; }
  .log .ok { color: var(--green); }
  .log .err { color: var(--red); }
  .hint { color: var(--muted); font-size: 12px; margin-top: 10px; }
  .legend { color: var(--muted); font-size: 12px; margin: 0 0 14px; }
  .legend b { color: var(--fg); }
  a { color: var(--accent); }
  code { font-family: Consolas, monospace; font-size: 12px; }
  footer {
    padding: 6px 24px 26px;
    text-align: center;
    color: var(--muted);
    font-size: 12px;
  }
  footer .update { color: var(--amber); margin-left: 10px; }
</style>
</head>
<body>
<header>
  <h1>Windows Admin MCP</h1>
  <div class="meta" id="meta">loading…</div>
</header>
<main>
  <div>
    <section>
      <h2>Tools
        <span class="h2-actions">
          <label class="master" title="Turn every tool on or off in one go">
            <input type="checkbox" id="all-enabled">all visible
          </label>
          <label class="master" title="Require approval for every tool, or for none">
            <input type="checkbox" id="all-approval">all approval
          </label>
        </span>
      </h2>
      <div class="body">
        <div class="legend">
          <b>Visible</b> decides whether MCP clients see the tool at all. <b>Approval</b> decides
          whether a call runs at once or parks here with a <code>confirmation_id</code>. Rest the
          pointer on a tool for its documentation.
        </div>
        <div class="hint" id="module-doc" style="margin:-6px 0 12px"></div>
        <div class="tabs" id="tabs"></div>
        <div id="tools"></div>
      </div>
    </section>
  </div>
  <div>
    <section>
      <h2>System</h2>
      <div class="body">
        <div class="kv" id="health"></div>
        <div class="hint" id="health-error"></div>
      </div>
    </section>
    <section>
      <h2>Awaiting approval
        <span class="h2-actions">
          <label class="master" title="On: the approval is asked for in the agent's own popup (MCP elicitation) and the result goes back to the agent. Clients without that capability park the action here instead.">
            <input type="checkbox" id="ask-in-agent">ask in agent
          </label>
          <label class="master" title="Off: only this page may run a parked action. On: an agent may call confirm_action itself, which is really its own permission.">
            <input type="checkbox" id="agent-confirm">agent may confirm
          </label>
        </span>
      </h2>
      <div class="body"><div id="pending"></div></div>
    </section>
    <section>
      <h2>Recent activity
        <span class="h2-actions">
          <button id="clear-audit" title="Forget the entries listed here. The audit file on disk is rewritten, tool settings are untouched.">Clear</button>
        </span>
      </h2>
      <div class="body"><div id="audit"></div></div>
    </section>
  </div>
</main>
<div id="docs-pop"><b></b><p></p></div>
<footer>
  <span id="version"></span>
</footer>
<script>
const api = async (path, init) => {
  const res = await fetch(path, init);
  if (!res.ok) throw new Error(await res.text());
  return res.status === 204 ? null : res.json();
};

const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/** Which module the tool list shows. Tool counts per module make a single page unreadable. */
let activeTab = null;

function moduleList(state) {
  return [...new Set(state.tools.map((t) => t.module))];
}

function renderTabs(state) {
  const modules = moduleList(state);
  if (!activeTab || !modules.includes(activeTab)) activeTab = modules[0];

  document.getElementById("tabs").innerHTML = modules.map((mod) => {
    const list = state.tools.filter((t) => t.module === mod);
    const on = list.filter((t) => t.enabled).length;
    return `<button class="tab ${mod === activeTab ? "active" : ""}" data-tab="${esc(mod)}" title="${esc(state.module_docs[mod] || "")}">${esc(mod)}<span class="count">${String(on)}/${String(list.length)}</span></button>`;
  }).join("");

  document.getElementById("module-doc").textContent = state.module_docs[activeTab] || "";
}

function renderTools(state) {
  renderTabs(state);
  const tools = state.tools.filter((t) => t.module === activeTab);

  document.getElementById("tools").innerHTML = `
    <div class="tool tool-head">
      <span></span><span></span>
      <span class="col" title="Off: hidden from tools/list, and a call anyway is rejected">visible<small>in tools/list</small></span>
      <span class="col" title="On: the call parks until you run it here or call confirm_action">approval<small>waits for you</small></span>
    </div>` + Object.entries([[activeTab, tools]]).map(([mod, group]) => {
    const on = (kind) => group.filter((t) => t[kind]).length;
    return `
    <div class="group">
      <div class="group-name"><span>${esc(mod)}</span>
        <span></span>
        <label class="master" title="Toggle every tool in ${esc(mod)}">
          <input type="checkbox" data-group="${esc(mod)}" data-kind="enabled" ${on("enabled") === tools.length ? "checked" : ""}>
        </label>
        <label class="master" title="Toggle approval for every tool in ${esc(mod)}">
          <input type="checkbox" data-group="${esc(mod)}" data-kind="approval" ${on("requires_approval") === tools.length ? "checked" : ""}>
        </label>
      </div>
      ${group.map((t) => `
        <div class="tool" data-docs-tool="${esc(t.name)}">
          <div>
            <div class="name">${esc(t.name)}</div>
            <div class="desc">${esc(t.description)}</div>
          </div>
          <span class="badge ${t.destructive ? "write" : ""}">${t.destructive ? "write" : "read"}</span>
          <label title="visible to MCP clients — off means hidden from tools/list">
            <input type="checkbox" data-tool="${esc(t.name)}" data-kind="enabled" ${t.enabled ? "checked" : ""}>
          </label>
          <label title="require approval before running — the call parks until you confirm">
            <input type="checkbox" data-tool="${esc(t.name)}" data-kind="approval" ${t.requires_approval ? "checked" : ""} ${t.enabled ? "" : "disabled"}>
          </label>
        </div>`).join("")}
    </div>`;
  }).join("");

  syncMasters(state);
}

/** The floating documentation card for the tool the pointer rests on. */
const pop = document.getElementById("docs-pop");

function showDocs(tool, rect) {
  pop.querySelector("b").textContent = `${tool.name} — ${tool.title}`;
  pop.querySelector("p").textContent = tool.docs || tool.description;
  pop.style.display = "block";

  const width = pop.offsetWidth;
  let left = rect.right + 12;
  if (left + width > window.innerWidth - 8) left = Math.max(8, window.innerWidth - width - 8);
  pop.style.left = `${String(left)}px`;
  pop.style.top = `${String(Math.max(8, Math.min(rect.top, window.innerHeight - pop.offsetHeight - 8)))}px`;
}

document.getElementById("tools").addEventListener("mouseover", (e) => {
  const row = e.target.closest?.("[data-docs-tool]");
  if (row) {
    const tool = snapshot?.tools.find((t) => t.name === row.dataset.docsTool);
    if (tool) {
      showDocs(tool, row.getBoundingClientRect());
      return;
    }
  }
  // Moving onto the gap between two rows must hide the card, or it would claim the wrong tool.
  if (!e.relatedTarget?.closest?.("[data-docs-tool]")) pop.style.display = "none";
});

document.getElementById("tabs").addEventListener("click", (e) => {
  const tab = e.target.closest?.("[data-tab]");
  if (!tab || tab.dataset.tab === activeTab) return;
  activeTab = tab.dataset.tab;
  renderTools(snapshot);
});

/** Third state for a master switch: some but not all members are on. */
function syncMasters(state) {
  for (const el of document.querySelectorAll("#tools input[data-group]")) {
    const list = state.tools.filter((t) => t.module === el.dataset.group);
    const key = el.dataset.kind === "enabled" ? "enabled" : "requires_approval";
    const on = list.filter((t) => t[key]).length;
    el.indeterminate = on > 0 && on < list.length;
  }

  const totals = [
    ["all-enabled", "enabled"],
    ["all-approval", "requires_approval"],
  ];
  for (const [id, key] of totals) {
    const el = document.getElementById(id);
    const on = state.tools.filter((t) => t[key]).length;
    el.checked = on === state.tools.length;
    el.indeterminate = on > 0 && on < state.tools.length;
  }
}

/** `{ requireApproval: { a: true, b: true } }` for a list of tools. */
const masterPayload = (list, kind, value) => ({
  [kind === "enabled" ? "enabled" : "requireApproval"]: Object.fromEntries(list.map((t) => [t.name, value])),
});

/** The footer carries the version and, when GitHub has a newer one, a link to the releases. */
function renderFooter(state) {
  const updates = state.latest_version
    ? `<a class="update" href="${esc(state.releases_url)}" title="A newer release exists">update available ${esc(state.latest_version)}</a>`
    : "";
  document.getElementById("version").innerHTML = `winadmin-mcp v${esc(state.version)}${updates}`;
}

function renderPending(items, resolve) {
  const el = document.getElementById("pending");
  if (!items.length) {
    el.innerHTML = '<div class="hint" style="margin:0">Nothing waiting. Enable <b>Approval</b> on a tool to gate it.</div>';
    return;
  }
  el.innerHTML = `<table class="pending">${items.map((p) => `
    <tr>
      <td><code>${esc(p.tool)}</code><br><span class="desc">${esc(JSON.stringify(p.args))}</span></td>
      <td class="actions">
        <button data-resolve="yes" data-id="${esc(p.id)}">Run</button>
        <button class="danger" data-resolve="no" data-id="${esc(p.id)}">Drop</button>
      </td>
    </tr>`).join("")}</table>`;
  void resolve;
}

function renderHealth(h) {
  const el = document.getElementById("health");
  const err = document.getElementById("health-error");
  if (!h) { el.innerHTML = ""; err.textContent = "loading…"; return; }
  if (h.error) { el.innerHTML = ""; err.textContent = h.error; return; }
  err.textContent = "";
  el.innerHTML = `
    <div><span>Computer</span><b>${esc(h.computer_name)}</b></div>
    <div><span>OS</span><b>${esc((h.os || "").replace(/^Microsoft /, ""))}</b></div>
    <div><span>Uptime</span><b>${esc(h.uptime_hours)} h</b></div>
    <div><span>CPU</span><b>${esc(h.cpu_load_pct)}%</b></div>
    <div><span>Memory free</span><b>${esc(h.memory?.free_gb)} / ${esc(h.memory?.total_gb)} GB</b></div>
    <div><span>Errors 24h</span><b>${esc(h.errors_last_24h)}</b></div>`;
}

function renderAudit(items) {
  const el = document.getElementById("audit");
  if (!items.length) { el.innerHTML = '<div class="hint" style="margin:0">No tool calls recorded yet.</div>'; return; }
  el.innerHTML = `<table class="log"><tr><th>time</th><th>tool</th><th>src</th><th>ms</th><th></th></tr>${
    items.map((r) => `<tr>
      <td>${esc(r.ts.slice(11, 19))}</td>
      <td>${esc(r.tool)}</td>
      <td>${esc(r.source)}</td>
      <td>${esc(r.durationMs)}</td>
      <td class="${r.ok ? "ok" : "err"}">${r.ok ? "ok" : esc((r.error || "error").slice(0, 40))}</td>
    </tr>`).join("")}</table>`;
}

let snapshot;

let signature = "";

async function refresh(force = false) {
  snapshot = await api("/api/state");
  document.getElementById("meta").textContent =
    `${snapshot.tools.filter((t) => t.enabled).length} of ${snapshot.tools.length} tools enabled · config ${snapshot.config_path}`;

  // Rendering on every poll would rebuild the DOM constantly, so compare what is visible.
  const next = JSON.stringify([
    snapshot.tools.map((t) => [t.name, t.enabled, t.requires_approval]),
    snapshot.pending.map((p) => p.id),
    snapshot.audit.slice(0, 25).map((r) => [r.ts, r.tool, r.ok]),
    snapshot.audit_generation,
    snapshot.health,
    snapshot.latest_version,
    snapshot.allow_agent_confirm,
    snapshot.ask_in_agent,
  ]);
  if (!force && next === signature) return;
  signature = next;

  renderTools(snapshot);
  renderPending(snapshot.pending);
  renderAudit(snapshot.audit);
  renderHealth(snapshot.health);
  renderFooter(snapshot);
  document.getElementById("agent-confirm").checked = snapshot.allow_agent_confirm === true;
  document.getElementById("ask-in-agent").checked = snapshot.ask_in_agent === true;
}

/** An agent can park an action or call a tool at any moment, so the page keeps itself current. */
setInterval(() => {
  if (!document.hidden) refresh().catch(() => undefined);
}, 2000);

/** After our own write the server is authoritative, so render unconditionally. */
async function patch(body) {
  await api("/api/tools", {
    method: "PATCH",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(body),
  });
  await refresh(true);
}

document.getElementById("tools").addEventListener("change", (e) => {
  const input = e.target;
  if (!input.dataset) return;

  // A group header switch: apply to every tool of that module.
  if (input.dataset.group) {
    const list = snapshot.tools.filter((t) => t.module === input.dataset.group);
    if (input.dataset.kind === "approval") {
      awaitlessPatch(masterPayload(list, "approval", input.checked));
    } else {
      awaitlessPatch(masterPayload(list, "enabled", input.checked));
    }
    return;
  }

  if (!input.dataset.tool) return;
  if (input.dataset.kind === "enabled") patch({ enabled: { [input.dataset.tool]: input.checked } });
  else patch({ requireApproval: { [input.dataset.tool]: input.checked } });
});

for (const [id, kind] of [["all-enabled", "enabled"], ["all-approval", "approval"]]) {
  document.getElementById(id).addEventListener("change", (e) => {
    awaitlessPatch(masterPayload(snapshot.tools, kind, e.target.checked));
  });
}

async function patchSettings(body) {
  try {
    await api("/api/settings", {
      method: "PATCH",
      headers: { "content-type": "application/json" },
      body: JSON.stringify(body),
    });
    await refresh(true);
  } catch (err) {
    document.getElementById("meta").textContent = String(err);
  }
}

document.getElementById("agent-confirm").addEventListener("change", (e) => {
  patchSettings({ allowAgentConfirm: e.target.checked });
});

document.getElementById("ask-in-agent").addEventListener("change", (e) => {
  patchSettings({ askInAgent: e.target.checked });
});

/** A master switch re-renders the whole list, so it must not block on the round trip. */
function awaitlessPatch(body) {
  patch(body).catch((err) => { document.getElementById("meta").textContent = String(err); });
}

document.getElementById("pending").addEventListener("click", async (e) => {
  const btn = e.target.closest?.("button[data-resolve]");
  if (!btn) return;
  await api(`/api/pending/${btn.dataset.id}`, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify({ action: btn.dataset.resolve === "yes" ? "confirm" : "cancel" }),
  });
  await refresh();
});

document.getElementById("clear-audit").addEventListener("click", async () => {
  await api("/api/audit/clear", { method: "POST" });
  await refresh(true);
});

refresh().catch((err) => { document.getElementById("meta").textContent = String(err); });
</script>
</body>
</html>
